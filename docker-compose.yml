services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: personal-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
